[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunping"
version = "0.1.1"
description = "ping-like tool for TUN/SOCKS VPNs that answer ICMP locally (HTTPS TTFB, not ICMP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mceblvn", email = "mceblvn@users.noreply.github.com" }]
keywords = ["ping", "vpn", "tun", "socks", "ttfb", "network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
tunping = "tunping.__main__:main"

[project.urls]
Homepage = "https://github.com/mceblvn/tunping"

[tool.setuptools]
license-files = ["LICENSE*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
